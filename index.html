<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="0; url=http://localhost:3000">
    <title>ระบบบันทึกและตรวจสอบโหลดหม้อแปลง PEA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        window.location.replace("http://localhost:3000");
    </script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Prompt', -apple-system, sans-serif;
            background-color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: #0f172a;
        }
        .gateway-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 20px;
            padding: 36px 42px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            text-align: center;
            max-width: 480px;
            width: 90%;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3.5px solid #f6eaf7;
            border-top-color: #741b77;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        h3 { font-size: 1.15rem; font-weight: 700; color: #0f172a; margin-bottom: 8px; }
        p { font-size: 0.85rem; color: #64748b; margin-bottom: 16px; line-height: 1.5; }
        a {
            display: inline-block;
            background: #741b77;
            color: #ffffff;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            padding: 10px 20px;
            border-radius: 12px;
            transition: background 0.2s;
        }
        a:hover { background: #58145a; }
    </style>
</head>
<body>
    <div class="gateway-card">
        <div class="spinner"></div>
        <h3>ระบบบันทึกและตรวจสอบโหลดหม้อแปลง PEA</h3>
        <p>กำลังเชื่อมต่อไปยังเซิร์ฟเวอร์ Next.js 15 PWA (Port 3000)...</p>
        <a href="http://localhost:3000">เข้าสู่ระบบทันที</a>
    </div>
</body>
</html>
